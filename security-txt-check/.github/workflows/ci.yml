# Lint, types and tests on every push and pull request, plus the action itself on Linux, macOS
# and Windows. Publishes nothing (see release.yml).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: Unit tests (fake HTTPS, real gpg)
        run: pytest --cov=security_txt_check --cov-report=term-missing --cov-fail-under=90

  links:
    name: lookproof.dev links exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -m network

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/security_txt_check-*.whl
          cd /tmp && /tmp/clean/bin/security-txt-check --file "$GITHUB_WORKSPACE"/tests/data/security.txt --fail-on none

  action:
    name: action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the action from this checkout
        id: check
        uses: ./
        with:
          domains: lookproof.dev
          files: tests/data/security.txt
          # Smoke test: we check that the tool runs, not the site's file.
          fail-on: none
      - name: Verify outputs
        shell: bash
        env:
          REPORT: ${{ steps.check.outputs.json }}
          EXIT_CODE: ${{ steps.check.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = "0"
          echo "$REPORT" | grep -q '"tool": "security-txt-check"'
          if echo "$REPORT" | grep -q '"check-internal-error"'; then exit 1; fi
