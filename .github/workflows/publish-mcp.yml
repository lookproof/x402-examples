# Publishes the lookproof-mcp package (mcp-server/) when a tag mcp-vX.Y.Z is pushed: to PyPI, then
# server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# The tag must match the version in src/lookproof_mcp/__init__.py and server.json. PyPI uses
# Trusted Publishing from the "pypi" environment and the registry GitHub OIDC (io.github.lookproof):
# no token is stored in the repo.
# Run the workflow by hand (workflow_dispatch) to publish only server.json from master to the
# registry, for a version that is already on PyPI.
name: publish-mcp

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
      - name: Tag, package and server.json versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import json, os, re, sys
          tag = os.environ["TAG"].removeprefix("mcp-v")
          init = open("mcp-server/src/lookproof_mcp/__init__.py").read()
          package = re.search(r'__version__ = "([^"]+)"', init).group(1)
          server = json.load(open("mcp-server/server.json"))
          versions = {"tag": tag, "package": package, "server.json": server["version"]}
          versions |= {f"server.json {p['identifier']}": p["version"] for p in server["packages"]}
          print(versions)
          sys.exit(0 if len(set(versions.values())) == 1 else "versions differ")
          EOF
      - run: pip install -r tests/requirements.txt
      - name: Build, install in an empty venv and test
        run: python -m pytest tests/test_package.py -v
      - name: Build the distributions
        working-directory: mcp-server
        run: |
          rm -rf dist
          uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: mcp-server/dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lookproof-mcp/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  registry:
    needs: pypi
    # After a successful PyPI upload, or alone when run by hand.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the MCP Registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        working-directory: mcp-server
        run: ../mcp-publisher publish
