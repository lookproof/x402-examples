# Publishes the lookproof-mcp package (mcp-server/) to PyPI when a tag mcp-vX.Y.Z is pushed.
# The tag must match the version in src/lookproof_mcp/__init__.py and server.json. Uploads with
# PyPI Trusted Publishing (OIDC) from the "pypi" environment: no token is stored in the repo.
name: publish-mcp

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
      - name: Tag, package and server.json versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import json, os, re, sys
          tag = os.environ["TAG"].removeprefix("mcp-v")
          init = open("mcp-server/src/lookproof_mcp/__init__.py").read()
          package = re.search(r'__version__ = "([^"]+)"', init).group(1)
          server = json.load(open("mcp-server/server.json"))
          versions = {"tag": tag, "package": package, "server.json": server["version"]}
          versions |= {f"server.json {p['identifier']}": p["version"] for p in server["packages"]}
          print(versions)
          sys.exit(0 if len(set(versions.values())) == 1 else "versions differ")
          EOF
      - run: pip install -r tests/requirements.txt
      - name: Build, install in an empty venv and test
        run: python -m pytest tests/test_package.py -v
      - name: Build the distributions
        working-directory: mcp-server
        run: |
          rm -rf dist
          uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: mcp-server/dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lookproof-mcp/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
